<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GYM TOGETHER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        /* CSS nội bộ riêng cho bảng Admin */
        .admin-stat-card {
            background: var(--surface-light);
            padding: 24px;
            border-radius: var(--border-radius-md);
            border-left: 4px solid var(--primary-color);
        }
        .admin-stat-card h3 { font-size: 32px; margin: 8px 0 0; }
        .admin-table-wrapper {
            overflow-x: auto;
            background: var(--surface-color);
            border-radius: var(--border-radius-md);
            margin-top: 24px;
        }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #333; font-size: 14px; }
        th { color: var(--text-muted); font-weight: 500; background: var(--surface-light); }
        .action-btn { background: none; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; padding: 4px; }
        .action-btn:hover { color: var(--primary-color); }
        .action-btn.delete:hover { color: var(--danger-color); }
    </style>
</head>
<body style="padding-bottom: 0;"> <!-- Tắt padding của bottom nav -->

    <div id="toast-container"></div>
    
    <!-- Full Screen Loader kiểm tra quyền Admin -->
    <div id="admin-auth-loader" style="position: fixed; inset: 0; background: var(--bg-color); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column;">
        <i class='bx bx-loader-alt bx-spin' style="font-size: 40px; color: var(--primary-color);"></i>
        <p class="mt-4">Đang xác thực quyền Admin...</p>
    </div>

    <div class="admin-layout" style="display: none;" id="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar hidden-mobile">
            <h2 style="color: var(--primary-color); margin-bottom: 40px; font-weight: 800;">ADMIN DASHBOARD</h2>
            
            <ul style="display: flex; flex-direction: column; gap: 8px;">
                <li><a href="#" class="btn btn-outline" style="justify-content: flex-start; border:none; background: rgba(0,255,136,0.1);"><i class='bx bxs-dashboard'></i> Tổng quan</a></li>
                <li><a href="#" class="btn btn-outline" style="justify-content: flex-start; border:none; color: var(--text-main);"><i class='bx bx-calendar-plus'></i> Quản lý Lịch tập</a></li>
                <li><a href="#" class="btn btn-outline" style="justify-content: flex-start; border:none; color: var(--text-main);"><i class='bx bx-list-check'></i> Quản lý Booking</a></li>
                <li><a href="#" class="btn btn-outline" style="justify-content: flex-start; border:none; color: var(--text-main);"><i class='bx bxs-group'></i> Thành viên</a></li>
            </ul>

            <div style="position: absolute; bottom: 24px; width: calc(100% - 48px);">
                <a href="index.html" class="btn btn-outline" style="border:none; color: var(--text-muted);"><i class='bx bx-arrow-back'></i> Về trang chủ</a>
                <button id="logout-btn" class="btn btn-danger mt-4"><i class='bx bx-log-out'></i> Đăng xuất</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-content" style="padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h1 style="font-size: 24px;">Tổng Quan</h1>
                <button class="btn btn-primary" style="width: auto;" onclick="openCreateScheduleModal()"><i class='bx bx-plus'></i> TẠO LỊCH MỚI</button>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="admin-stat-card">
                    <p style="color: var(--text-muted); font-size: 14px;">TỔNG THÀNH VIÊN</p>
                    <h3 id="stat-members">--</h3>
                </div>
                <div class="admin-stat-card">
                    <p style="color: var(--text-muted); font-size: 14px;">LỊCH SẮP TỚI</p>
                    <h3 id="stat-schedules">--</h3>
                </div>
                <div class="admin-stat-card">
                    <p style="color: var(--text-muted); font-size: 14px;">BOOKING HÔM NAY</p>
                    <h3 id="stat-bookings">--</h3>
                </div>
            </div>

            <!-- Table -->
            <h3 style="margin-top: 40px; margin-bottom: 16px;">Lịch tập gần đây</h3>
            <div class="admin-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Tên buổi tập</th>
                            <th>Thời gian</th>
                            <th>Số lượng</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="admin-schedules-list">
                        <tr>
                            <td colspan="5" class="text-center" style="padding: 30px; color: var(--text-muted);">Đang tải dữ liệu...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
