<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - GYM TOGETHER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
    
    <div id="toast-container"></div>

    <div class="auth-container" style="width: 100%; text-align: center;">
        <h2 style="margin-bottom: 8px;">Tạo Tài Khoản</h2>
        <p style="color: var(--text-muted); margin-bottom: 32px;">Tham gia tập luyện cùng nhóm ngay hôm nay</p>

        <form id="register-form">
            <div class="form-group">
                <label>Họ và Tên</label>
                <input type="text" id="fullname" class="form-control" placeholder="Vd: Nguyễn Văn A" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="Nhập email" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: 16px;">ĐĂNG KÝ</button>
        </form>

        <p style="margin-top: 24px; font-size: 14px; color: var(--text-muted);">
            Đã có tài khoản? <a href="login.html" style="color: var(--primary-color); font-weight: 600;">Đăng nhập</a>
        </p>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
