<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GYM TOGETHER - Train Together, Get Stronger</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Boxicons (Icons thể thao, giao diện) -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Top Navigation (Desktop) -->
    <nav class="top-nav hidden-mobile">
        <div class="top-nav-logo">GYM TOGETHER</div>
        <div class="top-nav-links">
            <a href="index.html" class="active">Lịch Tập</a>
            <a href="profile.html">Hồ Sơ</a>
            <a href="admin.html" id="nav-admin" class="hidden">Admin</a>
            <a href="login.html" id="nav-login" class="btn btn-outline" style="padding: 8px 16px; width: auto;">Đăng Nhập</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="container mt-4">
        <div class="hero" style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url('assets/images/hero-bg.jpg') center/cover; padding: 40px 20px; border-radius: var(--border-radius-lg); text-align: center;">
            <h1 style="color: var(--primary-color); font-size: 32px; font-weight: 800; text-transform: uppercase;">GYM TOGETHER</h1>
            <p style="color: #ccc; margin: 10px 0 24px; font-size: 16px;">Train Together. Get Stronger.</p>
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <button class="btn btn-primary" style="width: auto;" onclick="document.getElementById('schedules-section').scrollIntoView({behavior: 'smooth'})">XEM LỊCH TẬP</button>
                <a href="register.html" class="btn btn-outline" style="width: auto;">ĐĂNG KÝ THÀNH VIÊN</a>
            </div>
        </div>
    </header>

    <!-- Upcoming Schedules -->
    <main class="container" id="schedules-section">
        <h2 class="section-title">LỊCH TẬP SẮP TỚI</h2>
        
        <!-- Filter/Tabs (Mockup) -->
        <div style="display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px;">
            <span class="badge" style="background: var(--primary-color); color: #000; padding: 8px 16px;">Tất cả</span>
            <span class="badge" style="background: var(--surface-light); padding: 8px 16px;">Push Day</span>
            <span class="badge" style="background: var(--surface-light); padding: 8px 16px;">Pull Day</span>
            <span class="badge" style="background: var(--surface-light); padding: 8px 16px;">Leg Day</span>
        </div>

        <!-- Render dữ liệu từ Supabase vào đây -->
        <div class="schedules-grid" id="schedules-container">
            <!-- Loading Skeleton (Hiển thị tạm khi chưa fetch xong) -->
            <div class="text-center" style="color: var(--text-muted); padding: 40px 0;">
                <i class='bx bx-loader-alt bx-spin' style="font-size: 32px; color: var(--primary-color);"></i>
                <p class="mt-4">Đang tải lịch tập...</p>
            </div>
            
            <!-- Ví dụ 1 Card (Sau này render bằng JS) -->
            <!--
            <div class="schedule-card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Push Day - Nâng Tạ Đẩy</div>
                        <div class="card-meta"><i class='bx bx-calendar'></i> Thứ 2, 20/09/2026</div>
                        <div class="card-meta"><i class='bx bx-time'></i> 18:00 - 19:30</div>
                        <div class="card-meta"><i class='bx bx-map'></i> California Fitness</div>
                    </div>
                    <span class="badge open"><i class='bx bx-check-circle'></i> Còn 4 slot</span>
                </div>
                <div class="capacity-bar">
                    <div class="capacity-fill" style="width: 66%;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
                    <span>Đã đăng ký: 8/12</span>
                    <span>Max: 12</span>
                </div>
                <button class="btn btn-primary" onclick="openBookingModal('uuid')">ĐĂNG KÝ NGAY</button>
            </div>
            -->
        </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class='bx bxs-calendar-event'></i>
            <span>Lịch Tập</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class='bx bxs-user'></i>
            <span>Hồ Sơ</span>
        </a>
        <a href="admin.html" class="nav-item hidden" id="mobile-nav-admin">
            <i class='bx bxs-dashboard'></i>
            <span>Admin</span>
        </a>
    </nav>

    <!-- Script App Logic -->
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/schedule.js"></script>
</body>
</html>
