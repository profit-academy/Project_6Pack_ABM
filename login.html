<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - GYM TOGETHER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
    
    <div id="toast-container"></div>

    <div class="auth-container" style="width: 100%; text-align: center;">
        <h1 style="color: var(--primary-color); font-weight: 800; margin-bottom: 8px;">GYM TOGETHER</h1>
        <p style="color: var(--text-muted); margin-bottom: 32px;">Chào mừng bạn quay lại!</p>

        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="Nhập email của bạn" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: 16px;">ĐĂNG NHẬP</button>
        </form>

        <p style="margin-top: 24px; font-size: 14px; color: var(--text-muted);">
            Chưa có tài khoản? <a href="register.html" style="color: var(--primary-color); font-weight: 600;">Đăng ký ngay</a>
        </p>
        <p style="margin-top: 16px;">
            <a href="index.html" style="font-size: 14px; text-decoration: underline; color: #666;">Quay lại trang chủ</a>
        </p>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
